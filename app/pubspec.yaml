name: rememberem
description: "Remember the people you meet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1
  geolocator: ^14.1.2
  speech_to_text: ^7.5.0
  quick_actions: ^1.1.1
  path_provider: ^2.1.6
  rememberem_core:
    path: ../packages/rememberem_core
  # Daily reminders (story 14). Pinned exactly: checked for no network use.
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # A public-domain NASA portrait for the on-device face detection test.
    - integration_test/assets/portrait.jpg

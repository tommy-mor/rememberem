name: rememberem
description: "Remember the people you meet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1
  geolocator: ^14.1.2
  speech_to_text: ^7.5.0
  quick_actions: ^1.1.1
  path_provider: ^2.1.6
  rememberem_core:
    path: ../packages/rememberem_core
  # Daily reminders (story 14). Pinned exactly: checked for no network use.
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  flutter_timezone: 5.1.1
  flutter_map: 8.3.2
  latlong2: 0.10.1
  image_picker: 1.2.4
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # Builds photos with EXIF in tests; same version the core resolves.
  image: 4.12.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    # A public-domain NASA portrait for the on-device face detection test.
    - integration_test/assets/portrait.jpg
    # The wordmark for the app bar. The large originals in assets/branding
    # only feed the icon and splash generators below and are not shipped.
    - assets/branding/logo_text_small.png
    # Practice game sounds, made by tool/make_sounds.py.
    - assets/sounds/

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo_full.png
  remove_alpha_ios: true
  adaptive_icon_background: "#021E5C"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#021E5C"
  image: assets/branding/splash.png
  android_12:
    color: "#021E5C"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#021E5C"

